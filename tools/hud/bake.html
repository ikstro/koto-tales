<html><head><meta charset="utf-8"><title>HUD piece bake</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><pre id="out"></pre>
<script type="module">
// Renders every HUD piece as a real toy part with the game's diorama skin material
// (skin.partMaterial) under the world's warm sun, on a transparent background.
// Run by tools/hud/bake.mjs (`npm run hud`), which writes public/hud/*.png and src/ui/hudSprites.ts.
//
// Every sprite has a css "frame" (w × h, 1 stud = 40 css px) that all pieces share the
// scale and camera tilt of; the PNG is trimmed to its visible pixels, and the trim rect
// (x, y, cw, ch, css px inside the frame) is recorded. Bodies are stored at 2× for tablet
// DPR; contact shadows are blurred here and stored at 1× (they are soft anyway).
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/examples/jsm/geometries/RoundedBoxGeometry.js';
import { createSkin } from '/src/render/skins/index.ts';
import { Models } from '/src/assets/models.ts';
import { createBuilding, createPortal } from '/src/assets/buildings.ts';
import { createVillageItem } from '/src/assets/villages.ts';
import { createCastle, createCastleItem } from '/src/assets/castles.ts';
import { createChest } from '/src/assets/props.ts';
import { B } from '/src/world/blocks.ts';

const U = 40, DPR = 2, LO = 1.5, TILT = THREE.MathUtils.degToRad(34);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const skin = createSkin('diorama');
const models = new Models(skin);
const M = (c, o) => skin.partMaterial(c, o);

// --- the world's light (DAY key of the diorama skin), sun from the screen's upper-left
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;
scene.add(new THREE.HemisphereLight(0xe8ecdc, 0x6e5a32, 1.0));
const sun = new THREE.DirectionalLight(0xffd9a0, 3.6);
sun.position.set(-0.85, 0.85, -0.55).multiplyScalar(20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 50 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 3;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xffc887, 0.6); fill.position.set(3, 2, 4); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ color: 0x3a2008, opacity: 0.55 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;

const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);

// --- geometry helpers ------------------------------------------------------------
const STUD_R = 0.3, STUD_H = 0.2, PLATE_H = 0.4;
/** A rounded-edge solid of revolution: outer radius R, height h, edge round b (optionally a hole). */
function roundDisc(R, h, b, inner = 0) {
  const pts = [];
  const arc = (cx, cy, a0, a1, n = 8) => { for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push(new THREE.Vector2(cx + Math.cos(a) * b, cy + Math.sin(a) * b)); } };
  if (inner) { arc(inner + b, h - b, Math.PI / 2, Math.PI, 6); arc(inner + b, b, Math.PI, Math.PI * 1.5, 6); }
  else pts.push(new THREE.Vector2(0, 0));
  arc(R - b, b, -Math.PI / 2, 0); arc(R - b, h - b, 0, Math.PI / 2);
  if (inner) pts.push(pts[0].clone()); else pts.push(new THREE.Vector2(0, h));
  const g = new THREE.LatheGeometry(pts, 96);
  g.computeVertexNormals();
  return g;
}
const studGeo = roundDisc(STUD_R, STUD_H, 0.045);
function stud(mat, x, y, z) { const s = new THREE.Mesh(studGeo, mat); s.position.set(x, y, z); return s; }
function rectPlate(cols, rows, color, h = PLATE_H, studs = true) {
  const g = new THREE.Group(); const m = M(color);
  const b = new THREE.Mesh(new RoundedBoxGeometry(cols, h, rows, 4, 0.08), m); b.position.y = h / 2; g.add(b);
  if (studs) for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) g.add(stud(m, i + 0.5 - cols / 2, h - 0.01, j + 0.5 - rows / 2));
  return g;
}
/** A printed decal on a flat top: the tile's own plastic, with a texture printed in flat colours. */
function printMat(tex, opts) {
  const m = M('#ffffff', opts).clone();
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; m.map = tex; m.needsUpdate = true;
  return m;
}
function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); draw(x, size);
  return new THREE.CanvasTexture(c);
}
/** Round tile: R in studs (1 = 2x2), with a printed top. */
function roundTile(R, color, print, h = PLATE_H) {
  const g = new THREE.Group(); const b = 0.1;
  g.add(new THREE.Mesh(roundDisc(R, h, b), M(color)));
  if (print) {
    const top = new THREE.Mesh(new THREE.CircleGeometry(R - b * 0.9, 96), printMat(canvasTex(512, (x, s) => {
      x.fillStyle = color; x.fillRect(0, 0, s, s); x.save(); print(x, s); x.restore();
    })));
    top.rotation.x = -Math.PI / 2; top.position.y = h + 0.002; g.add(top);
  }
  return g;
}
/** The gold rim of the active tile, alone: laid over a round tile of radius R, height h. */
function rim(R, h, color) {
  const g = new THREE.Group();
  const r = new THREE.Mesh(roundDisc(R + 0.02, 0.1, 0.045, R - 0.2), M(color)); r.position.y = h - 0.02; g.add(r);
  return g;
}

// --- printed icons (flat, high-contrast, drawn in a 512 box) -------------------
const CREAM = '#ffe3a3', INK = '#4a2c14';
function printBow(x, s) {
  x.translate(s / 2, s / 2); x.rotate(-Math.PI / 4); x.lineCap = 'round'; x.lineJoin = 'round';
  x.strokeStyle = CREAM; x.lineWidth = 40;
  x.beginPath(); x.moveTo(-40, -150); x.quadraticCurveTo(-210, 0, -40, 150); x.stroke();
  x.lineWidth = 10; x.beginPath(); x.moveTo(-40, -150); x.lineTo(-40, 150); x.stroke();
  x.strokeStyle = '#3b2010'; x.lineWidth = 22;
  x.beginPath(); x.moveTo(-110, 0); x.lineTo(130, 0); x.stroke();
  x.fillStyle = '#3b2010'; x.beginPath(); x.moveTo(190, 0); x.lineTo(110, -46); x.lineTo(126, 0); x.lineTo(110, 46); x.closePath(); x.fill();
  x.fillStyle = CREAM;
  for (const d of [-1, 1]) { x.beginPath(); x.moveTo(-70, 0); x.lineTo(-130, d * 44); x.lineTo(-160, d * 40); x.lineTo(-110, 0); x.closePath(); x.fill(); }
}
function boltPath(x, s) {
  const p = [[0.12, 0.66], [-0.32, -0.04], [-0.03, -0.04], [-0.17, -0.66], [0.34, 0.1], [0.05, 0.1], [0.22, 0.66]];
  x.beginPath(); p.forEach(([a, b], i) => { const X = s / 2 + a * s * 0.56, Y = s / 2 - b * s * 0.56; i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.closePath();
}
const printBolt = (col) => (x, s) => { x.lineJoin = 'round'; boltPath(x, s); x.fillStyle = col; x.fill(); x.strokeStyle = col; x.lineWidth = 16; x.stroke(); };
function printJoy(x, s) {
  x.fillStyle = '#eab02b';
  for (let i = 0; i < 4; i++) { x.save(); x.translate(s / 2, s / 2); x.rotate(i * Math.PI / 2); x.beginPath(); x.moveTo(0, -s * 0.36); x.lineTo(-s * 0.07, -s * 0.28); x.lineTo(s * 0.07, -s * 0.28); x.closePath(); x.lineJoin = 'round'; x.lineWidth = 14; x.strokeStyle = '#eab02b'; x.fill(); x.stroke(); x.restore(); }
  x.fillStyle = 'rgba(0,0,0,0.16)'; x.beginPath(); x.arc(s / 2, s / 2, s * 0.21, 0, Math.PI * 2); x.fill();
}
/** Fullscreen: four corner brackets pointing out (enter) or in (leave). */
const printFull = (out, col) => (x, s) => {
  x.strokeStyle = col; x.lineWidth = 46; x.lineCap = 'round'; x.lineJoin = 'round';
  const a = 140, L = 82;
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const cx = s / 2 + sx * a, cy = s / 2 + sy * a;
    x.beginPath();
    if (out) { x.moveTo(cx - sx * L, cy); x.lineTo(cx, cy); x.lineTo(cx, cy - sy * L); }
    else { const ix = s / 2 + sx * (a - L * 0.15), iy = s / 2 + sy * (a - L * 0.15); x.moveTo(ix + sx * L, iy); x.lineTo(ix, iy); x.lineTo(ix, iy + sy * L); }
    x.stroke();
  }
};
const printPause = (col) => (x, s) => { x.fillStyle = col; for (const d of [-1, 1]) { x.beginPath(); x.roundRect(s / 2 + d * 70 - 34, s / 2 - 120, 68, 240, 26); x.fill(); } };
const printPlay = (col) => (x, s) => {
  x.fillStyle = col; x.strokeStyle = col; x.lineJoin = 'round'; x.lineWidth = 40;
  x.beginPath(); x.moveTo(s / 2 - 70, s / 2 - 120); x.lineTo(s / 2 + 120, s / 2); x.lineTo(s / 2 - 70, s / 2 + 120); x.closePath(); x.fill(); x.stroke();
};
const printSound = (on, col) => (x, s) => {
  x.fillStyle = col; x.strokeStyle = col; x.lineJoin = 'round'; x.lineCap = 'round';
  x.translate(s / 2 - 50, s / 2);
  x.beginPath(); x.moveTo(-110, -50); x.lineTo(-50, -50); x.lineTo(30, -125); x.lineTo(30, 125); x.lineTo(-50, 50); x.lineTo(-110, 50); x.closePath();
  x.lineWidth = 24; x.fill(); x.stroke();
  x.lineWidth = 32;
  if (on) { for (const r of [80, 150]) { x.beginPath(); x.arc(30, 0, r, -0.75, 0.75); x.stroke(); } }
  else { x.beginPath(); x.moveTo(90, -70); x.lineTo(210, 70); x.moveTo(210, -70); x.lineTo(90, 70); x.stroke(); }
};
const printHome = (col) => (x, s) => {
  x.fillStyle = col; x.strokeStyle = col; x.lineJoin = 'round'; x.lineWidth = 28;
  x.translate(s / 2, s / 2 + 20);
  x.beginPath(); x.moveTo(-170, -10); x.lineTo(0, -170); x.lineTo(170, -10); x.closePath(); x.fill(); x.stroke();
  x.beginPath(); x.roundRect(-120, -30, 240, 170, 14); x.fill();
  x.fillStyle = '#e0583f'; x.beginPath(); x.roundRect(-36, 40, 72, 100, [36, 36, 0, 0]); x.fill();
};
const printX = (col) => (x, s) => {
  x.strokeStyle = col; x.lineWidth = 64; x.lineCap = 'round';
  x.beginPath(); x.moveTo(s / 2 - 110, s / 2 - 110); x.lineTo(s / 2 + 110, s / 2 + 110); x.moveTo(s / 2 + 110, s / 2 - 110); x.lineTo(s / 2 - 110, s / 2 + 110); x.stroke();
};
/** ✓: put the building here. */
const printCheck = (col) => (x, s) => {
  x.strokeStyle = col; x.lineWidth = 70; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(s / 2 - 130, s / 2 + 10); x.lineTo(s / 2 - 40, s / 2 + 100); x.lineTo(s / 2 + 140, s / 2 - 100); x.stroke();
};
/** A crescent moon and two little stars: go to sleep. */
const printMoon = (col, star, bg) => (x, s) => {
  x.fillStyle = col;
  x.beginPath(); x.arc(s / 2 - 20, s / 2 + 10, 150, 0, Math.PI * 2); x.fill();
  x.fillStyle = bg;
  x.beginPath(); x.arc(s / 2 + 55, s / 2 - 45, 128, 0, Math.PI * 2); x.fill();
  x.fillStyle = star;
  for (const [cx, cy, r] of [[s / 2 + 120, s / 2 + 70, 36], [s / 2 + 50, s / 2 + 160, 24]]) {
    x.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
    x.closePath(); x.fill();
  }
};
/** An open box with an arrow going down into it: fold the building back into the kit. */
const printFold = (col, arrow) => (x, s) => {
  x.lineJoin = 'round'; x.lineCap = 'round';
  x.fillStyle = col; x.beginPath(); x.roundRect(s / 2 - 150, s / 2 + 10, 300, 150, 22); x.fill();
  x.fillStyle = 'rgba(255,227,163,0.35)'; x.fillRect(s / 2 - 150, s / 2 + 10, 300, 26);
  x.fillStyle = arrow; x.strokeStyle = arrow; x.lineWidth = 56;
  x.beginPath(); x.moveTo(s / 2, s / 2 - 190); x.lineTo(s / 2, s / 2 - 40); x.stroke();
  x.beginPath(); x.moveTo(s / 2 - 90, s / 2 - 70); x.lineTo(s / 2 + 90, s / 2 - 70); x.lineTo(s / 2, s / 2 + 40); x.closePath(); x.fill();
};
/** A door standing open with an arrow walking out of it: leave the game. */
const printExit = (col, arrow) => (x, s) => {
  x.lineJoin = 'round'; x.lineCap = 'round';
  x.fillStyle = col; x.beginPath(); x.roundRect(s / 2 - 150, s / 2 - 170, 190, 340, 18); x.fill();
  x.fillStyle = '#ffe3a3'; x.beginPath(); x.arc(s / 2 + 5, s / 2 + 10, 16, 0, Math.PI * 2); x.fill();
  x.strokeStyle = arrow; x.fillStyle = arrow; x.lineWidth = 50;
  x.beginPath(); x.moveTo(s / 2 - 40, s / 2 + 10); x.lineTo(s / 2 + 110, s / 2 + 10); x.stroke();
  x.beginPath(); x.moveTo(s / 2 + 95, s / 2 - 70); x.lineTo(s / 2 + 190, s / 2 + 10); x.lineTo(s / 2 + 95, s / 2 + 90); x.closePath(); x.fill();
};
/** The portal's warm swirl, for its map mark. */
const printSwirl = (x, s) => {
  const g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s * 0.42);
  g.addColorStop(0, '#fff6d6'); g.addColorStop(0.4, '#ffd23a'); g.addColorStop(1, '#e0583f');
  x.fillStyle = g; x.beginPath(); x.arc(s / 2, s / 2, s * 0.42, 0, Math.PI * 2); x.fill();
  x.strokeStyle = 'rgba(255,246,214,0.85)'; x.lineWidth = 26; x.lineCap = 'round';
  for (let arm = 0; arm < 3; arm++) {
    x.beginPath();
    for (let i = 0; i <= 40; i++) { const k = i / 40, a = arm * (Math.PI * 2 / 3) + k * Math.PI * 1.8, r = k * s * 0.38; const px = s / 2 + Math.cos(a) * r, py = s / 2 + Math.sin(a) * r; i ? x.lineTo(px, py) : x.moveTo(px, py); }
    x.stroke();
  }
};
/** «?» for the guide piece in the pause menu: a thick hook and a dot. */
const printHelp = (col) => (x, s) => {
  x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 60; x.lineCap = 'round'; x.lineJoin = 'round';
  const cx = s / 2, cy = s / 2 - 62;
  x.beginPath(); x.arc(cx, cy, 86, Math.PI * 1.08, Math.PI * 2.28);
  x.quadraticCurveTo(cx, cy + 70, cx, cy + 112); x.stroke();
  x.beginPath(); x.arc(cx, s / 2 + 148, 40, 0, Math.PI * 2); x.fill();
};
/** 1, 2 or 3 small Зомбік faces (difficulty): the face print clipped into round stickers. */
const printZombies = (n, drawFace) => (x, s) => {
  const r = n === 1 ? 165 : n === 2 ? 118 : 104;
  const pos = n === 1 ? [[0, 0]] : n === 2 ? [[-112, 0], [112, 0]] : [[-118, 62], [118, 62], [0, -98]];
  for (const [dx, dy] of pos) {
    const cx = s / 2 + dx, cy = s / 2 + dy;
    x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fillStyle = INK; x.fill();
    x.beginPath(); x.arc(cx, cy, r - 12, 0, Math.PI * 2); x.clip();
    x.translate(cx - r, cy - r); drawFace(x, r * 2); x.restore();
  }
};

// --- pieces ------------------------------------------------------------------
const C = {
  plate: '#2a6466', coral: '#e0583f', navy: '#2a5fa8', navyDeep: '#1d3f70', mustard: '#eab02b', heart: '#e8463a',
  num: '#f4cd72', blue: '#2f7fd6', gold: '#ffc93a', teal: '#2f918b', socket: '#1e4a4c', mint: '#59b3ab', green: '#3fa142',
  sky: '#8fcbe8',
};
function heartShape() {
  const s = new THREE.Shape();
  s.moveTo(0, -0.62); s.bezierCurveTo(-0.22, -0.42, -0.74, -0.08, -0.74, 0.26); s.bezierCurveTo(-0.74, 0.62, -0.3, 0.74, 0, 0.44);
  s.bezierCurveTo(0.3, 0.74, 0.74, 0.62, 0.74, 0.26); s.bezierCurveTo(0.74, -0.08, 0.22, -0.42, 0, -0.62);
  return s;
}
function heartTile() {
  const geo = new THREE.ExtrudeGeometry(heartShape(), { depth: 0.26, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.09, bevelSegments: 6, curveSegments: 32 });
  geo.rotateX(-Math.PI / 2); geo.translate(0, 0.1, 0);
  const g = new THREE.Group(); g.add(new THREE.Mesh(geo, M(C.heart))); return g;
}
/** Where a heart was: a low dark heart socket left on the plate. */
function heartSocket() {
  const geo = new THREE.ExtrudeGeometry(heartShape(), { depth: 0.04, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.05, bevelSegments: 3, curveSegments: 32 });
  geo.rotateX(-Math.PI / 2); geo.translate(0, 0.03, 0);
  const g = new THREE.Group(); g.add(new THREE.Mesh(geo, M(C.socket))); return g;
}
function coin() { return itemPiece('coin', 1.7, true); }
/** A game model scaled to `size` studs across, turned by `yaw`, standing on the ground in the middle. */
function fitted(obj, size, yaw = 0) {
  const holder = new THREE.Group(); obj.rotation.y = yaw; holder.add(obj); holder.updateMatrixWorld(true);
  const sz = new THREE.Box3().setFromObject(holder).getSize(new THREE.Vector3());
  holder.scale.setScalar(size / Math.max(sz.x, sz.z)); holder.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(holder), c = b.getCenter(new THREE.Vector3());
  holder.position.set(-c.x, -b.min.y + 0.02, -c.z);
  const g = new THREE.Group(); g.add(holder); return g;
}
/** The kit box: a mustard toolbox with a coral lid, a dark handle and a cream latch. */
function toolbox() {
  const g = new THREE.Group();
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m; };
  add(new RoundedBoxGeometry(2.1, 0.95, 1.3, 4, 0.1), M(C.mustard), 0, 0.475, 0);
  add(new RoundedBoxGeometry(2.18, 0.34, 1.38, 4, 0.1), M(C.coral), 0, 1.12, 0);
  for (const s of [-1, 1]) add(new RoundedBoxGeometry(0.16, 0.4, 0.16, 2, 0.05), M('#3b302b'), s * 0.5, 1.48, 0);
  add(new RoundedBoxGeometry(1.16, 0.16, 0.22, 2, 0.06), M('#3b302b'), 0, 1.68, 0);
  add(new RoundedBoxGeometry(0.36, 0.3, 0.08, 2, 0.04), M(CREAM), 0, 0.92, 0.68);
  for (const sx of [-0.75, 0.75]) g.add(stud(M(C.coral), sx, 1.28, 0));
  return g;
}
/** A game item, sized to `size` studs across, standing on the ground (`flat`: laid down like the coin). */
function itemPiece(id, size, flat = false) {
  const o = models.item(id); const holder = new THREE.Group(); holder.add(o);
  const b = new THREE.Box3().setFromObject(o), sz = b.getSize(new THREE.Vector3());
  if (flat) { if (sz.z < sz.x && sz.z < sz.y) o.rotation.x = -Math.PI / 2; else if (sz.x < sz.y) o.rotation.z = Math.PI / 2; }
  holder.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(holder), s2 = b2.getSize(new THREE.Vector3());
  const k = size / (flat ? Math.max(s2.x, s2.z) : Math.max(s2.x, s2.y, s2.z)); holder.scale.setScalar(k);
  holder.updateMatrixWorld(true);
  const b3 = new THREE.Box3().setFromObject(holder), c3 = b3.getCenter(new THREE.Vector3());
  o.parent.position.set(-c3.x, -b3.min.y + 0.02, -c3.z);
  const g = new THREE.Group(); g.add(holder); return g;
}
/**
 * A toy lantern: dark metal base, corner posts, cap and a little pyramid roof with a ring handle;
 * warm glass panes with a bright core printed on them (they glow). `lit` false: dull glass (an empty slot).
 */
const METAL = '#3b302b';
function lanternGlass() {
  const tex = canvasTex(256, (x, s) => {
    const g = x.createRadialGradient(s * 0.5, s * 0.54, 0, s * 0.5, s * 0.54, s * 0.62);
    g.addColorStop(0, '#fff8d2'); g.addColorStop(0.22, '#ffe58a'); g.addColorStop(0.55, '#ffb43a'); g.addColorStop(1, '#e9781e');
    x.fillStyle = g; x.fillRect(0, 0, s, s);
    // a soft glint down the left of each pane
    x.fillStyle = 'rgba(255,250,225,0.35)'; x.beginPath(); x.roundRect(s * 0.14, s * 0.12, s * 0.09, s * 0.62, s * 0.04); x.fill();
  });
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({ color: 0xffffff, map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.8, roughness: 0.18 });
}
function lanternModel(lit = true) {
  const g = new THREE.Group();
  // dark moulded plastic, a little rougher than the bricks so the sun does not turn it grey
  const metal = new THREE.MeshStandardMaterial({ color: METAL, roughness: 0.62, metalness: 0.1 });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m; };
  const GH = 1.75, BASE = 0.2, CAP = 0.18;

/** Alpha bounding box of a 2D canvas, in its pixels; null if empty. */
function bbox(cv) {
  const { width: W, height: H } = cv; const d = cv.getContext('2d').getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 2) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return x1 < 0 ? null : { x0, y0, x1: x1 + 1, y1: y1 + 1 };
}
/** Trim a canvas to its visible pixels on a grid of `step` px (so the css rect is whole). */
function trimmed(cv, scale, q = [4, 8]) {
  posterize(cv, q[0], q[1]);
  const st = scale === 1.5 ? 3 : scale < 1 ? 1 : scale;
  const b = bbox(cv) ?? { x0: 0, y0: 0, x1: st, y1: st }; const x0 = Math.floor(b.x0 / st) * st, y0 = Math.floor(b.y0 / st) * st;

  const t = document.createElement('canvas'); t.width = x1 - x0; t.height = y1 - y0;

/** Fewer distinct values → much smaller PNGs; invisible at sprite size. */
function posterize(cv, rgbStep, aStep) {
  const x = cv.getContext('2d'); const im = x.getImageData(0, 0, cv.width, cv.height); const d = im.data;
  const qa = (v) => Math.min(255, Math.round(v / aStep) * aStep), qc = (v) => Math.min(255, Math.round(v / rgbStep) * rgbStep);

function shoot(name, obj, w, h, { shadow = name + '-sh', oy = 0, dpr = DPR, top = false } = {}) {
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(obj); obj.updateMatrixWorld(true);
  frameCam(w, h, oy, top);
  renderer.setSize(Math.round(w * dpr), Math.round(h * dpr));
  renderer.clear(); renderer.render(scene, cam);
  const t = trimmed(grab(), dpr);
  out[name] = { w, h, oy, scale: dpr, x: t.x, y: t.y, cw: t.cw, ch: t.ch, png: t.png };
  if (shadow && !out[shadow]) {
    const mats = new Map();
    obj.traverse((o) => { if (o.isMesh) { const ms = Array.isArray(o.material) ? o.material : [o.material]; for (const m of ms) if (!mats.has(m)) { mats.set(m, [m.colorWrite, m.depthWrite]); m.colorWrite = false; m.depthWrite = false; } } });
    scene.add(ground); renderer.clear(); renderer.render(scene, cam); scene.remove(ground);

    const s = trimmed(shadowOf(grab(), w, h, dpr), 0.5, [1, 6]);
    out[shadow] = { w, h, oy, scale: 1, x: s.x, y: s.y, cw: s.cw, ch: s.ch, png: s.png };
  }
  scene.remove(obj);
  return out[name];
}

  const seed = createCastleItem(skin, 'elves'); seed.update(0.5, { night: 0, on: true, low: false, beat: 0 });
  shoot('item-castle-elves', roundTile(1, C.navy, modelPrint(still(seed.root), C.navy, -0.4, 0.75), 0.6), 130, 130, { shadow: 'tile6-sh' });
  const chest = createChest(skin);
  shoot('chest', roundTile(1, C.mustard, modelPrint(chest.root, C.mustard, -0.5, 0.72), 0.6), 130, 130, { shadow: 'tile6-sh' });
}

document.getElementById('out').textContent = JSON.stringify({ sprites: out, nine });
document.title = 'done';
</script></body></html>
